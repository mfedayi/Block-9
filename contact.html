<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="contact-page">
    <nav class="nav nav-pills flex-column flex-sm-row">
      <div id="name">
        <h2>Mustafa Fedayi</h2>
      </div>
      <a class="flex-sm-fill text-sm-center nav-link" href="home.html">HOME</a>
      <a class="flex-sm-fill text-sm-center nav-link" href="about.html"
        >ABOUT ME</a
      >
      <a class="flex-sm-fill text-sm-center nav-link" href="portfolio.html"
        >PORTFOLIO</a
      >
      <a class="flex-sm-fill text-sm-center nav-link active" href="contact.html"
        >CONTACT ME</a
      >
    </nav>
    <h1 class="contact-title">Contact Me</h1>
    <!-- Kept outside the container -->
    <div class="container">
      <h2>Get in touch with me</h2>
      <form action="success.html" method="POST" id="form" class="needs-validation" novalidate>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="validationCustom01">First name</label>
            <input
              type="text"
              class="form-control"
              id="validationCustom01"
              placeholder="First name"
              value="Mark"
              required
            />
          </div>
          <div class="col-md-4 mb-3">
            <label for="validationCustom02">Last name</label>
            <input
              type="text"
              class="form-control"
              id="validationCustom02"
              placeholder="Last name"
              value="Otto"
              required
            />
          </div>
          <div class="col-md-6 mb-3">
            <label for="validationCustomUsername">Username</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text" id="inputGroupPrepend">@</span>
              </div>
              <input
                type="text"
                class="form-control"
                id="validationCustomUsername"
                placeholder="Username"
                aria-describedby="inputGroupPrepend"
                required
              />
              <div class="invalid-feedback">Please choose a username.</div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="validationCustom03">City</label>
            <input
              type="text"
              class="form-control"
              id="validationCustom03"
              placeholder="City"
              required
            />
            <div class="invalid-feedback">Please provide a valid city.</div>
          </div>
          <div class="col-md-3 mb-3">
            <label for="validationCustom04">State</label>
            <input
              type="text"
              class="form-control"
              id="validationCustom04"
              placeholder="State"
              required
            />
            <div class="invalid-feedback">Please provide a valid state.</div>
          </div>
          <div class="col-md-3 mb-3">
            <label for="validationCustom05">Zip</label>
            <input
              type="text"
              class="form-control"
              id="validationCustom05"
              placeholder="Zip"
              required
            />
            <div class="invalid-feedback">Please provide a valid zip.</div>
          </div>
        </div>
        <div class="form-group">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              value=""
              id="invalidCheck"
              required
            />
            <label class="form-check-label" for="invalidCheck">
              Agree to terms and conditions
            </label>
            <div class="invalid-feedback">
              You must agree before submitting.
            </div>
          </div>
        </div>
        <button class="btn btn-primary" type="submit">Submit form</button>
      </form>
    </div>
  </body>
</html>
